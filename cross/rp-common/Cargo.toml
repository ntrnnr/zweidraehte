[package]
name = "rp-common"
version = "0.1.0"
edition = "2024"

[dependencies]
# Embassy core
embassy-net = { workspace = true, features = ["udp", "dhcpv4", "medium-ethernet", "multicast", "defmt"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac"] }
embassy-sync = { workspace = true }
embassy-hal-internal = { workspace = true }

# Embedded HAL traits
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-io-async = { workspace = true }
embassy-futures = { workspace = true }

# Cortex-M / embedded
cortex-m = { workspace = true }
defmt = { workspace = true }
portable-atomic = { version = "1.5", features = ["critical-section"] }
critical-section = "1.2.0"

# KNX stack and platform traits
zweidraehte-device = { path = "../../crates/zweidraehte-device", default-features = false, features = ["defmt"] }
zweidraehte-platform = { path = "../../crates/zweidraehte-platform", default-features = false, features = ["defmt"] }
zweidraehte-util = { path = "../../crates/zweidraehte-util" }

# Serialization for flash storage
postcard = { workspace = true }
serde = { workspace = true }

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040"]
rp235xa = ["embassy-rp/rp235xa"]
