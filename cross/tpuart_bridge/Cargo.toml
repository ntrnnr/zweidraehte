[package]
edition = "2024"
name = "tpuart_bridge"
version = "0.1.0"

[dependencies]
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-stm32 = { workspace = true, features = ["defmt", "stm32f103c8", "unstable-pac", "memory-x", "time-driver-any"] }

defmt = { workspace = true }
defmt-rtt = { workspace = true }

cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }
embedded-hal = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
futures = { workspace = true, features = ["async-await"] }
embedded-io-async = "0.7"
static-alloc = { workspace = true }
