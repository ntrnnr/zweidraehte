[workspace]
resolver = "2"

members = [
    "tpuart_bridge",
]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
incremental = false
lto = true
#lto = 'fat'
opt-level = "z"

[profile.release]
incremental = false
codegen-units = 1
debug = true
lto = true
#lto = 'fat'
opt-level = "z"
