[package]
name = "embedded-common"
version = "0.1.0"
edition = "2024"

# HAL-agnostic helpers shared across all embedded KNX targets
# (embassy-rp, embassy-stm32, etc.). No chip-specific deps live here.

[dependencies]
# Embassy async primitives
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = { workspace = true }

# Embedded HAL traits
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }

# Cortex-M system reset
cortex-m = { workspace = true }

defmt = { workspace = true }

# KNX platform traits (SystemControl) and shared ButtonEvent type
zweidraehte-platform = { path = "../../crates/zweidraehte-platform", default-features = false, features = ["defmt"] }
zweidraehte-util = { path = "../../crates/zweidraehte-util" }

# Busy gating around storage saves (BusyGuard): actor requests towards
# the TPUART link layer's chip busy-mode rendezvous
zweidraehte-device = { path = "../../crates/zweidraehte-device", default-features = false, features = ["defmt"] }
embassy-sync = { workspace = true }

# Inline (no_alloc) collections for the persistence backends' RAM mirrors.
heapless = { workspace = true }

# Config-store codec: postcard-serialised device state in the flash config
# region (the same format both per-crate stores used before unification).
postcard = { workspace = true }
serde = { workspace = true }

# A critical-section impl is required to link the host test binary (embassy
# pulls critical-section in); embedded firmware gets the impl from cortex-m.
critical-section = "1.2.0"

[features]
# BusyGate/BusyGuard talk to the TPUART link layer's busy machinery —
# only TP1 targets need them (and the tpuart module they reference).
tp1 = ["zweidraehte-device/tp1"]

# Enabled by host-side tests only so the persistence backend tests can link
# on the host. Pulls in a critical-section impl and an `embassy-time` driver
# (the `embassy-time` dep emits `_embassy_time_now`); defmt's `_defmt_*`
# symbols are satisfied by the no-op `#[defmt::global_logger]` in the test
# module. Embedded firmware never sets this; it gets all three from the
# cortex-m runtime / chip HAL / defmt-rtt.
test-host = ["critical-section/std", "embassy-time/mock-driver"]
