[package]
name = "zweidraehte-device"
version = "0.1.0"
edition = "2024"

[dependencies]
zweidraehte-util = { path = "../zweidraehte-util", default-features = false }
zweidraehte-proto = { path = "../zweidraehte-proto", default-features = false }
zweidraehte-platform = { path = "../zweidraehte-platform", default-features = false }
zweidraehte-ets = { path = "../zweidraehte-ets" }
zweidraehte-device-macros = { path = "../zweidraehte-device-macros" }

zerocopy = { workspace = true }
const-default = { workspace = true }
paste = { workspace = true }
static_cell = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }
embedded-io-async = { workspace = true }
heapless = { workspace = true }
replace_with = { workspace = true }

# critical-section is a transitive dependency (via embassy-sync) but we
# re-export CriticalSectionRawMutex as the recommended Mutex type for
# cross-executor use. On std targets, enable "critical-section/std" to
# provide the platform implementation. On embedded targets, the HAL
# provides it (e.g. embassy-rp's `critical-section-impl` feature).
critical-section = { version = "1.2.0", optional = true }
# portable-atomic provides AtomicU8 with CAS on targets without native CAS
# (e.g. thumbv6m). On targets with native CAS (thumbv7em, x86_64) it
# transparently delegates to core::sync::atomic. The `critical-section`
# feature is the fallback path used on thumbv6m; embassy-rp already
# wires up the implementation via `critical-section-impl`.
portable-atomic = { version = "1.13.1", default-features = false, features = ["critical-section"] }
subtle = { version = "2.6.1", default-features = false }
# no_std codec for the ConfigStore device-config blob (moved here with the
# storage backends from `embedded-common`).
postcard = { workspace = true }

[dev-dependencies]
test-case = "3.3"
# The `service_registry_smoke` integration test implements the `Layer` trait
# against shim types, whose `next_deadline` returns
# `Option<embassy_time::Instant>` and whose `process` takes proto message
# buffers. The test crate needs both directly: the library does not re-export
# `embassy-time`, and it exposes the proto modules only through a
# `#[doc(hidden)]` macro-support module that is not public API.
embassy-time = { workspace = true }
zweidraehte-proto = { path = "../zweidraehte-proto", default-features = false }
# The persist-gate round-trip (mc_timer watermark, 03/08/09 §2.2.4.2)
# uses CriticalSectionRawMutex reply channels; lib tests need the std
# critical-section implementation to link.
critical-section = { version = "1.2.0", features = ["std"] }
# Used by the `extension_state_config_derive` test to assert the
# `#[derive(ExtensionState)]`-generated `*Config` types serialize to the same
# JSON (field names / serde defaults) as the hand-written structs they replaced,
# so a saved config keeps round-tripping.
serde_json = { workspace = true }

# The RF-retransmitter property-description scan test builds a real interface-
# object container on the host, which needs the std critical-section impl for
# the embassy-sync channels inside `LayerContext`.
[[test]]
name = "rf_retransmitter_property_scan"
required-features = ["std"]

# Serde-stability guard for the `#[derive(ExtensionState)]` config mirrors.
# Needs `std` for `serde_json`.
[[test]]
name = "extension_state_config_derive"
required-features = ["std"]

[features]
defmt = ["dep:defmt", "zweidraehte-util/defmt", "zweidraehte-proto/defmt", "zweidraehte-platform/defmt", "heapless/defmt"]
log = ["dep:log", "zweidraehte-util/log", "zweidraehte-proto/log", "zweidraehte-platform/log"]
std = ["zweidraehte-proto/std", "zweidraehte-platform/std", "critical-section/std"]
linux = ["zweidraehte-platform/linux", "std"]
knxip = ["zweidraehte-proto/knxip"]
# KNX IP Secure unicast sessions on the KNX/IP link layer. Separate from
# `knxip` because the X25519 handshake pulls in curve25519 — non-secure
# IP builds must not pay the dependency. Without this feature the
# `WithIpSecure` feature marker (and the secure feature-set aliases) do
# not exist, so a secure device definition fails to compile rather than
# silently dropping secure traffic.
ip-secure = ["knxip", "zweidraehte-proto/ip-secure"]
tp1 = []
rf = []
ip-interface = ["knxip", "tp1"]
usb = ["std", "dep:async-hid", "dep:futures-lite"]
conformance = ["std"]

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
async-hid = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
