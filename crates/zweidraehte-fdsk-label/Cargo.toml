[package]
name = "zweidraehte-fdsk-label"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
description = "Allocation-free KNX FDSK label encoding with optional text and terminal QR rendering."

[lib]
name = "fdsk_label"

[dependencies]
qrcode = { version = "0.14", default-features = false, optional = true }

[features]
default = ["qr"]
std = []
# QR rendering uses allocation and stdout; the codec needs neither.
qr = ["std", "dep:qrcode"]
