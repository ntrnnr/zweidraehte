[package]
name = "zweidraehte-client"
version = "0.1.0"
edition.workspace = true
description = "KNX/IP client library for device management"

[dependencies]
zweidraehte-proto = { path = "../zweidraehte-proto", features = ["std", "log", "knxip", "usb-hid"] }

tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "signal"] }
log = { workspace = true }
thiserror = { workspace = true }

# Data Secure: OS CSPRNG for the sync-handshake challenge, serde for the
# JSON sequence-number store.
getrandom = "0.4"
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }

# USB connector: KNX USB interfaces are HID devices. async-hid brings its
# own reactor threads, so it composes with tokio without a bridge.
async-hid = { workspace = true }
futures-lite = { workspace = true }

# .knxkeys keyring import: PBKDF2 password hash, AES-128-CBC attribute
# decryption, SHA-256 signature, base64 attribute values, XML parsing.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
cbc = "0.1"
aes = "0.8"
base64 = "0.22"
sha2 = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
env_logger = { workspace = true }
# start_paused test runtime for the secure-handshake timeout tests.
tokio = { version = "1", features = ["test-util"] }
