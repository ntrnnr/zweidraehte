[package]
name = "zweidraehte-microdevice"
version = "0.1.0"
edition = "2024"
description = "Ultra-lightweight, no-async KNX device stack for BCU-era masks"

[dependencies]
zweidraehte-proto = { path = "../zweidraehte-proto" }
zweidraehte-ets-model = { path = "../zweidraehte-ets-model" }

heapless = { workspace = true }
serde = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[features]
default = []
# Host-side extras: the blocking Unix-socket link driver and the
# postcard snapshot type the conformance DUT persists to shared memory.
std = ["dep:serde", "dep:postcard", "dep:log", "postcard/use-std"]
defmt = ["dep:defmt"]
log = ["dep:log"]
# Host-only conformance support: the manufacturer test resources used by EITT,
# and the `KNX_TIME_DIVISOR` fast mode that compresses protocol timeouts
# (`src/timing.rs`). Embedded products never enable this, so certification
# hooks cannot enter their property roster or binary, and their timeouts are
# constants.
conformance = ["std"]

[dev-dependencies]
postcard = { workspace = true, features = ["use-std"] }
