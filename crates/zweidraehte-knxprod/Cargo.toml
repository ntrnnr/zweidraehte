[package]
name = "zweidraehte-knxprod"
version = "0.1.0"
edition = "2024"
authors = ["Andreas Galauner <andreas@galauner.de>"]
license = "AGPL-3.0-only"
description = "KNX product definition generator and page-layout DSL"

[dependencies]
zweidraehte-ets-files = { path = "../zweidraehte-ets-files", default-features = false }
zweidraehte-ets-model = { path = "../zweidraehte-ets-model" }
zweidraehte-proto = { path = "../zweidraehte-proto" }

serde = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
paste = { workspace = true }
const-default = { workspace = true }
log = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }

[features]
default = ["packaging"]

# With no features the crate is only the Rust product-definition DSL and XML
# generators. Parsing, schemas, and package mechanics live in
# `zweidraehte-ets-files`; the features below enable generation conveniences
# that delegate to that foundation.

# Resolve `MasterDataSource`: local file, or download from
# update.knx.org with an on-disk cache (what ETS does).
master-data = ["zweidraehte-ets-files/master-data-download"]

# Cryptographic signing and `.knxprod` writing. It also enables cached master
# data download to preserve the generator convenience API's default behavior.
packaging = [
    "master-data",
    "zweidraehte-ets-files/signing",
]

[dev-dependencies]
tempfile = "=3.25.0"
toml = "1.1.3"
