[package]
name = "knx-config"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Check and commission devices from a KNX project"

[[bin]]
name = "knx-dump"
path = "src/bin/knx_dump.rs"

[[bin]]
name = "knx-loader"
path = "src/bin/knx_loader.rs"

[dependencies]
# Fetch and cache the product-selected Master Data generation when the caller
# does not supply an explicit document.
zweidraehte-client = { path = "../../crates/zweidraehte-client", features = ["cli", "project", "javascript", "master-data-download"] }

anyhow = "1"
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zweidraehte-project = { version = "0.1.0", path = "../../crates/zweidraehte-project" }
dialoguer = { version = "0.12", default-features = false }
time = { version = "0.3.47", features = ["formatting"] }
zweidraehte-ets-files = { version = "0.1.0", path = "../../crates/zweidraehte-ets-files", features = ["signing"] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "=3.25.0"
