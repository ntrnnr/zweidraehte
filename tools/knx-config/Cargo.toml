[package]
name = "knx-config"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Check and commission devices from a KNX project"

[[bin]]
name = "knx-dump"
path = "src/bin/knx_dump.rs"

[[bin]]
name = "knx-loader"
path = "src/bin/knx_loader.rs"

[dependencies]
zweidraehte-knxprod = { path = "../../crates/zweidraehte-knxprod", default-features = false, features = ["product-files"] }
# `master-data-download` so a machine without KNX_MASTER_DATA still
# resolves the mask layer the way ETS does (fetch + cache).
zweidraehte-client = { path = "../../crates/zweidraehte-client", features = ["cli", "master-data-download"] }

anyhow = "1"
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zweidraehte-project = { version = "0.1.0", path = "../../crates/zweidraehte-project" }

[dev-dependencies]
insta = "1.48.0"
