[package]
name = "testutil"
version = "0.1.0"
edition = "2024"

[dependencies]
zweidraehte = { path = "../stack", features = ["log", "test-util", "usb"] }
knx-conformance = { path = "../conformance" }
platform = { path = "../platform", features = ["log", "linux"] }
knxprod = { path = "../knxprod" }

embassy-sync = { workspace = true, features = ["std"] }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std"] }
embassy-futures = { workspace = true }

const-default = { workspace = true }
static_cell = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

embedded-io-async = { workspace = true }


env_logger = "0.11"
log = "0.4"
chrono = "0.4"
quick-xml = { version = "0.37", features = ["serialize"] }
base64 = "0.22"
regex = "1"
async-hid = { workspace = true }
futures-lite = { workspace = true }
libc = "0.2"

[[bin]]
name = "testutil"
path = "src/main.rs"

[[bin]]
name = "tpuart"
path = "src/tpuart.rs"

[[bin]]
name = "knxip"
path = "src/knxip.rs"

[[bin]]
name = "stack_knxip"
path = "src/stack_knxip.rs"

[[bin]]
name = "busmon"
path = "src/busmon.rs"

[[bin]]
name = "usb_test"
path = "src/usb_test.rs"

[[bin]]
name = "seqno_test"
path = "src/seqno_test.rs"

[[bin]]
name = "stack_system_b"
path = "src/stack_system_b.rs"

[[bin]]
name = "gen_mtxml"
path = "src/gen_mtxml.rs"

[[bin]]
name = "gen_mdt_mtxml"
path = "src/gen_mdt_mtxml.rs"
