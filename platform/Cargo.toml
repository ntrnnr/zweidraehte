[package]
name = "platform"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

embedded-io-async = { workspace = true }

# Linux deps
embassy-time = { workspace = true }
serialport = { workspace = true, optional = true }
async-io = { workspace = true, optional = true }
nix = { workspace = true, optional = true, features = ["term", "socket", "net"] }
socket2 = { workspace = true, optional = true }


[target.'cfg(target_os = "linux")'.dependencies]
serialport_low_latency = { workspace = true, optional = true }

[features]
defmt = ["dep:defmt"]
log = ["dep:log"]
std = []
linux = ["dep:serialport", "dep:async-io", "dep:nix", "dep:serialport_low_latency", "dep:socket2", "std"]
