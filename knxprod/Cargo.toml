[package]
name = "knxprod"
version = "0.1.0"
edition = "2024"
authors = ["Andreas Galauner <andreas@galauner.de>"]
license = "Proprietary"
description = "KNX product definition generator - schema, generator, and page layout DSL"

[dependencies]
zweidraehte = { path = "../stack" }

serde = { workspace = true }
quick-xml = { version = "0.37", features = ["serialize"] }
base64 = "0.22"
regex = "1"
paste = "1.0"
const-default = { workspace = true }
log = { workspace = true }

# Signing and packaging dependencies
sha1 = "0.10"
rsa = { version = "0.9", features = ["hazmat"] }
rand = "0.8"
num-bigint-dig = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
icu = "1.5"
reqwest = { version = "0.12", features = ["blocking"] }
directories = "5.0"
thiserror = "2.0"
