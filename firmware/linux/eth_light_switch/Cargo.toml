[package]
edition = "2024"
license.workspace = true
name = "linux_eth_light_switch"
version = "0.1.0"

# Linux-hosted KNX/IP light switch — the host-target sibling of
# `firmware/rp2040/eth_light_switch`, running the shared
# `devices::light_switch` definition over the read-only `LinuxIpPlatform`
# (UDP + TCP, routing + remote config, no tunnelling). Unlike the MCU
# families this builds for the host target, so there is no
# .cargo/config.toml — a plain `cargo build` in this directory works.

[dependencies]
# Embassy core (std flavour)
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std"] }
embassy-sync = { workspace = true, features = ["std"] }
embassy-futures = { workspace = true }
static_cell = { workspace = true }

# Host logging
env_logger = "0.11"
log = "0.4"

# KNX stack and device definitions. `light_switch` is a no_std definition,
# so the demo feature is not needed — take it default-features = false.
zweidraehte-device = { path = "../../../crates/zweidraehte-device", default-features = false, features = ["linux", "knxip", "log"] }
zweidraehte-platform = { path = "../../../crates/zweidraehte-platform", features = ["log", "linux"] }
zweidraehte-devices = { path = "../../../examples/devices", default-features = false }
zweidraehte-support = { path = "../../../examples/support" }
