[package]
edition = "2024"
license.workspace = true
name = "pico_wifi_light_switch"
version = "0.1.0"

[dependencies]
# Embassy core
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-futures = { workspace = true }
embassy-net = { workspace = true, features = ["udp", "dhcpv4", "medium-ethernet", "multicast", "defmt"] }

# CYW43 WiFi driver
cyw43 = { workspace = true, features = [] }
cyw43-pio = { workspace = true, features = [] }

# Cortex-M / embedded
cortex-m = { workspace = true, features = ["inline-asm"] }
cortex-m-rt = { workspace = true }
embedded-hal = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
futures = { workspace = true, features = ["async-await"] }
embedded-io-async = { workspace = true }
static_cell = { workspace = true }
# KNX stack and device definitions
zweidraehte-device = { path = "../../../crates/zweidraehte-device", default-features = false, features = ["defmt", "knxip"] }
zweidraehte-platform = { path = "../../../crates/zweidraehte-platform", default-features = false, features = ["defmt"] }
zweidraehte-devices = { path = "../../../examples/devices", default-features = false, features = ["defmt"] }

# Shared RP platform code
rp-common = { path = "../common", features = ["rp2040"] }
# HAL-agnostic helpers (CortexMSystem)
embedded-common = { path = "../../common/embedded-common" }

[build-dependencies]
dev-provisioning-build = { path = "../../common/dev-provisioning-build" }

[features]
provision-on-boot = ["rp-common/provision-on-boot"]
