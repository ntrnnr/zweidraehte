[package]
edition = "2024"
license.workspace = true
name = "stm32g0_knxrf_secure_light_switch"
version = "0.1.0"

# KNX **Data Secure** KNX-RF light switch for STM32G0B0RE. The secure
# analogue of `firmware/stm32/g0_knxrf_device` (see also
# `firmware/stm32/g0_tp1_secure_light_switch` for the TP1 secure variant):
# `SecureDeviceBuilder` instead of `InsecureDeviceBuilder`, the RF
# medium extension wrapped in Data Secure, and a FRAM-backed
# sequence-number store on SPI2. Build with:
#
#     ZZ_FDSK_HEX=$(openssl rand -hex 16) cargo build --release
#
# (or enable `provision-on-boot` for bench builds).

[dependencies]
# Embassy core
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-stm32 = { workspace = true, features = ["defmt", "stm32g0b0re", "unstable-pac", "memory-x", "time-driver-any", "exti"] }
embassy-futures = { workspace = true }

# Cortex-M / embedded
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
static_cell = { workspace = true }

# KNX stack and device definitions (RF link layer + RF Medium Object + Data Secure)
zweidraehte-device = { path = "../../../crates/zweidraehte-device", default-features = false, features = ["defmt", "rf"] }
zweidraehte-platform = { path = "../../../crates/zweidraehte-platform", default-features = false, features = ["defmt"] }
zweidraehte-devices = { path = "../../../examples/devices", default-features = false, features = ["defmt"] }

# SX1211 driver + KNX-RF physical-layer codec (for radio init in `main`).
knxrf = { path = "../../common/knxrf", features = ["defmt"] }

# Shared STM32 platform code: the SX1211 adapter (`rf` feature), secure flash
# identity, FRAM seq storage, and the S-A_Sync PRNG.
stm32-common = { path = "../common", features = ["rf"] }
# HAL-agnostic helpers (DebouncedButton, CortexMSystem)
embedded-common = { path = "../../common/embedded-common" }

[build-dependencies]
dev-provisioning-build = { path = "../../common/dev-provisioning-build" }

[features]
provision-on-boot = ["stm32-common/provision-on-boot"]
