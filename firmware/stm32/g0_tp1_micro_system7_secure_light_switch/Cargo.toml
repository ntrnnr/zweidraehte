# Data Secure System 7 light switch on the polling micro stack. The target
# stays raw-PAC and executor-free; only secure micro firmware pulls in the
# shared ADC/FRAM helper.
[package]
edition = "2024"
license.workspace = true
name = "stm32g0_tp1_micro_system7_secure_light_switch"
version = "0.1.0"

[dependencies]
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }
stm32-metapac = { version = "19", features = ["stm32g0b0re", "rt"] }

defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
heapless = { workspace = true }
postcard = { workspace = true }

stm32-micro-common = { path = "../micro-common" }
zweidraehte-microdevice = { path = "../../../crates/zweidraehte-microdevice", default-features = false, features = ["defmt"] }
zweidraehte-proto = { path = "../../../crates/zweidraehte-proto", default-features = false, features = ["defmt"] }
zweidraehte-devices = { path = "../../../examples/devices", default-features = false, features = ["micro"] }
zweidraehte-util = { version = "0.1.0", path = "../../../crates/zweidraehte-util" }

[build-dependencies]
dev-provisioning-build = { path = "../../common/dev-provisioning-build" }

[features]
# Production refuses to boot without a valid KNXP serial/FDSK record.
provision-on-boot = []
