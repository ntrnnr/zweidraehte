[package]
name = "zweidraehte-conformance"
version = "0.1.0"
edition = "2024"
description = "KNX conformance testing framework"
license = "AGPL-3.0-only"

[dependencies]
zweidraehte-device = { path = "../crates/zweidraehte-device", features = ["log", "linux", "knxip", "ip-secure", "conformance"] }
zweidraehte-proto = { path = "../crates/zweidraehte-proto", features = ["log", "knxip", "ip-secure", "std"] }
# The parent-side runners are tokio; the DUT children are embassy.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
embassy-sync = { workspace = true }
embassy-time = { workspace = true, features = ["std"] }
embassy-futures = { workspace = true }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
const-default = { workspace = true }
zerocopy = { workspace = true }
static_cell = { workspace = true }
paste = { workspace = true }
heapless = { workspace = true }
log = { workspace = true, features = ["std"] }
async-io = "2"
futures-lite = { workspace = true }
nix = { version = "0.29", features = ["mman", "fs"] }
tempfile = "3"
serde = { workspace = true, features = ["derive", "alloc", "std"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde_with = { workspace = true, features = ["macros"] }
getrandom = "0.4.2"
env_logger = { workspace = true }
zweidraehte-platform = { path = "../crates/zweidraehte-platform", features = ["linux"] }
socket2 = "0.6.4"
quick-xml = { workspace = true, features = ["serialize"] }
toml = "1.1.3"

[[bin]]
name = "conformance-runner"
path = "src/bin/runner.rs"

# Runs the vendor EITT XML templates directly; see src/eitt/.
[[bin]]
name = "conformance-eitt"
path = "src/bin/eitt.rs"

[[bin]]
name = "conformance-dut-systemb"
path = "src/bin/dut_systemb.rs"

[[bin]]
name = "conformance-dut-systemb-secure"
path = "src/bin/dut_systemb_secure.rs"

[[bin]]
name = "conformance-dut-ip-secure"
path = "src/bin/dut_ip_secure.rs"

[[bin]]
name = "conformance-dut-system7"
path = "src/bin/dut_system7.rs"

[[bin]]
name = "conformance-dut-system7-secure"
path = "src/bin/dut_system7_secure.rs"
