[package]
name = "zweidraehte-conformance"
version = "0.1.0"
edition = "2024"
description = "KNX conformance testing framework"
license = "AGPL-3.0-only"

# ==============================================================================
# Features
# ==============================================================================
#
# The crate spans a process boundary: `src/harness/` drives the tests,
# `src/dut/` *is* the device under test, and `src/ipc/` is the wire
# between them. `dut` gates the second of those, which is the crate's
# only user of the device stack and of embassy.
#
# The point is not build time — a plain `cargo build` needs everything
# anyway, since the parent spawns the DUT binaries, and the device crate
# stays in the graph regardless (zweidraehte-client → zweidraehte-knxprod
# → zweidraehte-device, for the ETS descriptor types). The point is that
#
#     cargo check -p zweidraehte-conformance --no-default-features
#
# fails the moment the parent half reaches into the device stack to
# answer a question it should have asked over the socket: without the
# feature it is not a *direct* dependency, so it is not in the extern
# prelude and `use zweidraehte_device::…` does not resolve. That has
# been a convention documented in module headers; now it is a build
# error.

[features]
default = ["dut"]
dut = [
    "dep:zweidraehte-device",
    "dep:zweidraehte-devices",
    "dep:zweidraehte-ets-model",
    "dep:zweidraehte-microdevice",
    "dep:zweidraehte-knxprod",
    "dep:base64",
    "dep:zweidraehte-platform",
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:const-default",
    "dep:heapless",
    "dep:serde_with",
    "dep:static_cell",
    "dep:zerocopy",
]

# ==============================================================================
# Dependencies
# ==============================================================================

[dependencies]

# --- Both halves ------------------------------------------------------------
zweidraehte-proto = { path = "../crates/zweidraehte-proto", features = ["log", "knxip", "ip-secure", "std"] }
serde = { workspace = true, features = ["derive", "alloc", "std"] }
postcard = { version = "1.1.3", features = ["alloc"] }
log = { workspace = true, features = ["std"] }
nix = { version = "0.29", features = ["mman", "fs"] }
# The socket half of `src/ipc/` is async on both sides, but the two sides
# run under different executors — async-io's reactor is what lets one
# module serve both.
async-io = "2"

# --- Parent only ------------------------------------------------------------
# The configuration runner drives the real client library against the
# DUT; tokio is its runtime (the parent side is executor-agnostic and
# runs under it unchanged).
# Conformance configuration downloads are host-side integration tests. Let
# them resolve the published master data the same way ETS does: an explicit
# `KNX_MASTER_DATA` wins, otherwise use the versioned cache/download.
zweidraehte-client = { path = "../crates/zweidraehte-client", features = ["master-data-download"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-lite = { workspace = true }
tempfile = "3"
env_logger = { workspace = true }
# EITT template XML (src/eitt/schema.rs) and the profile/patch TOML.
quick-xml = { workspace = true, features = ["serialize"] }
toml = "1.1.3"
# Both belong to the parent despite looking DUT-shaped: the IP Secure
# test definitions in src/tests/ip_secure/ join the multicast group
# themselves and generate their own nonces.
socket2 = "0.6.4"
getrandom = "0.4.2"

# --- DUT only (feature `dut`) -----------------------------------------------
zweidraehte-device = { path = "../crates/zweidraehte-device", features = ["log", "linux", "knxip", "ip-secure", "conformance"], optional = true }
# The BCU2 DUT is the no-async micro stack — a different crate on
# purpose, so the blocking DUT binary proves it runs without embassy.
zweidraehte-microdevice = { path = "../crates/zweidraehte-microdevice", features = ["std", "log", "conformance"], optional = true }
# Each DUT's product file is generated in-process from the same constants
# that build its stack, then read back through the client — a full
# generator/parser round-trip; see dut::system7_product and
# dut::system_b_product.
zweidraehte-knxprod = { path = "../crates/zweidraehte-knxprod", optional = true }
zweidraehte-devices = { path = "../examples/devices", features = ["demos", "micro"], optional = true }
zweidraehte-ets-model = { path = "../crates/zweidraehte-ets-model", optional = true }
# The BCU2 product generator base64-encodes the DUT's boot EEPROM image
# into the product file's default <Data>.
base64 = { workspace = true, optional = true }
zweidraehte-platform = { path = "../crates/zweidraehte-platform", features = ["linux"], optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, features = ["std"], optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"], optional = true }
const-default = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
serde_with = { workspace = true, features = ["macros"], optional = true }

# ==============================================================================
# Binaries
# ==============================================================================
#
# The two scripted runners carry no `required-features`: they spawn the
# DUT as a separate executable and never name a device type, so they are
# the ones that prove the boundary holds.

[[bin]]
name = "conformance-runner"
path = "src/bin/runner.rs"

# Runs the vendor EITT XML templates directly; see src/eitt/.
[[bin]]
name = "conformance-eitt"
path = "src/bin/eitt.rs"

# Drives the real zweidraehte-client library (configuration download)
# against the System 7 and System B DUTs; see src/bin/configuration.rs.
#
# The one runner that needs `dut`: it generates the DUT's product file to
# download, and what a device's product data says is device knowledge. An
# alternative would be to ask the running child for its MTXML over the
# IPC socket, which would put this binary in the clean half too — at the
# price of linking the whole knxprod generator into all four DUT
# binaries. Not worth it while they share a crate; revisit if the DUT
# half ever becomes a package of its own.
[[bin]]
name = "conformance-configuration"
path = "src/bin/configuration.rs"
required-features = ["dut"]

[[bin]]
name = "conformance-dut-systemb"
path = "src/bin/dut_systemb.rs"
required-features = ["dut"]

[[bin]]
name = "conformance-dut-systemb-secure"
path = "src/bin/dut_systemb_secure.rs"
required-features = ["dut"]

[[bin]]
name = "conformance-dut-ip-secure"
path = "src/bin/dut_ip_secure.rs"
required-features = ["dut"]

[[bin]]
name = "conformance-dut-system7"
path = "src/bin/dut_system7.rs"
required-features = ["dut"]

# The BCU2 DUT: the `zweidraehte-microdevice` stack in a plain blocking
# main loop — no embassy executor anywhere in the process.
[[bin]]
name = "conformance-dut-bcu1"
path = "src/bin/dut_bcu1.rs"
required-features = ["dut"]

[[bin]]
name = "conformance-dut-bcu2"
path = "src/bin/dut_bcu2.rs"
required-features = ["dut"]

# Mask 0021h: the same blocking micro stack with the Data Secure profile
# module and the extended-frame capacity it requires.
[[bin]]
name = "conformance-dut-bcu2-secure"
path = "src/bin/dut_bcu2_secure.rs"
required-features = ["dut"]

# The same secure composition booted with the base BCU2 test application.
# Keeping this as a separate child prevents the AN158 group-object fixture
# from leaking into Network/Transport/Management test expectations.
[[bin]]
name = "conformance-dut-bcu2-secure-base"
path = "src/bin/dut_bcu2_secure_base.rs"
required-features = ["dut"]

# The micro-System-7 DUT: the same micro stack instantiated for mask
# 0705h (TL Style 3, RT8/M112 tables, both load-control paths).
[[bin]]
name = "conformance-dut-micro-system7"
path = "src/bin/dut_micro_system7.rs"
required-features = ["dut"]

# The same micro System 7 base profile with the composable Data Secure
# module, extended-frame wire capacity, and durable sequence store.
[[bin]]
name = "conformance-dut-micro-system7-secure"
path = "src/bin/dut_micro_system7_secure.rs"
required-features = ["dut"]

[[bin]]
name = "conformance-dut-system7-secure"
path = "src/bin/dut_system7_secure.rs"
required-features = ["dut"]
