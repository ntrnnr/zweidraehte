# Transport-layer adaptation owned by the polling System 7 fixture.
#
# The vendor template activates its Style-2 alternative for E09 in
# OPEN_WAIT. System 7 mandates Style 3, independently of which stack
# implements it, so the micro DUT must select the disconnect alternative.

template = "KnxConformanceTestTemplate-TransportLayer"

[[patch]]
replace = "62A76FBA-FDA9-44D1-8BF2-FD06D2089566"
why = "6.4.2.2: micro System 7 follows 03/03/04 §5.4.3 Style 3, where E09 in OPEN_WAIT disconnects instead of repeating"
insert = [
  { expect = { data = "B0 #BDUT_ADDR #IFACE_A_ADDR 60 81", timeout_ms = 500 } },
]
