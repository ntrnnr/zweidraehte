# The Network-Layer fixture toggles programming mode through an Interface
# Object property. BCU1 has no Interface Objects; operate its real programming
# bit through the same DUT control used for a physical button.

template = "KnxConformanceTestTemplate-NetworkLayer"

[[patch]]
replace = "9751C3E4-7C55-42D5-9B46-B8558864BAAF"
why = "3.4 setup: BCU1 has no PID_SYSTEM_STATE Property; set its programming-mode resource through DUT control"
insert = [{ set_programming_mode = true }]

[[patch]]
skip = "8134C2C5-9C7F-405C-B33D-E9479D3730D8"
why = "3.4 setup: the harness programming-mode operation has no KNX Property response"

[[patch]]
replace = "CD6ABC50-0A98-4936-AB8E-A6863A387D3A"
why = "3.4 cleanup: clear the BCU1 programming-mode resource through DUT control"
insert = [{ set_programming_mode = false }]

[[patch]]
