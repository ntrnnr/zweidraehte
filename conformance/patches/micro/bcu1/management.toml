template = "KnxConformanceTestTemplate-Management"

# DD2 is optional for BCU1 and this fixture does not implement it. The XML
# ships its positive expectation active and its standard 3Fh/empty negative
# response inactive; replace the active branch so the case tests our declared
# capability rather than a reference device's.
[[patch]]
replace = "E7888E82-4216-4038-8DF0-370E0216E092"
why = "2.5.3: BCU1 implements no optional DD2 and answers with descriptor type 3Fh"
insert = [
  { expect = { data = "BC #BDUT #EDI 61 43 7F", timeout_ms = 1000 } },
]

# The template hard-codes FFh as the untouched value at the last accessible
# octet. Its reference fixture starts erased; the BCU1 RAM window starts
# cleared. The case is about rejecting the two-byte write that straddles the
# boundary, so compare against this fixture's actual pre-write value.
[[patch]]
replace = "1D21BA4E-2234-4F06-9E5B-B38808B37E94"
why = "2.32.2: BCU1 RAM is cleared rather than erased, so its untouched last accessible octet is 00h"
insert = [
  { expect = { data = "BC #BDUT #EDI 65 42 C1 01 #MEM_ACCESSIBLE_END 00", timeout_ms = 1000 } },
]
