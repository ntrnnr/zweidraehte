# BCU2-specific choice in the EITT transport-layer template.

template = "KnxConformanceTestTemplate-TransportLayer"

# Like the Network Layer template, case 2.2 toggles an application-fixture
# PID_SYSTEM_STATE Property which the System-2 Device Object does not have.
# Drive the BCU programming-mode bit through the DUT control channel instead.
[[patch]]
replace = "459B144D-E653-4CCB-BCD8-9ACB40BB9A14"
why = "2.2 setup: set the BCU2 programming-mode resource instead of the non-profile PID_SYSTEM_STATE fixture Property"
insert = [{ set_programming_mode = true }]

[[patch]]
skip = "A302C6B6-F33C-4B6A-A8E1-676E928AB4E8"
why = "2.2 setup: the harness programming-mode operation has no KNX Property response"

[[patch]]
replace = "8B6F0392-6645-4D8D-A231-0F6DE48166A2"
why = "2.2 cleanup: clear the BCU2 programming-mode resource instead of the non-profile PID_SYSTEM_STATE fixture Property"
insert = [{ set_programming_mode = false }]

[[patch]]
skip = "DFB94331-1941-4098-9FEC-CFA09535DAEC"
why = "2.2 cleanup: the harness programming-mode operation has no KNX Property response"

# 03/03/04 §5.4.1 Style 1 handles a wrong T_ACK sequence in OPEN_WAIT
# by disconnecting. The template activates the Style 2 alternative,
# which stays in OPEN_WAIT and retransmits after the acknowledgement
# timeout, while shipping the immediate-disconnect expectation disabled.
[[patch]]
replace = "62A76FBA-FDA9-44D1-8BF2-FD06D2089566"
why = "6.4.2.2: BCU2 uses 03/03/04 §5.4.1 Style 1, where E09 in OPEN_WAIT disconnects instead of repeating"
insert = [
  { expect = { data = "B0 #BDUT_ADDR #IFACE_A_ADDR 60 81", timeout_ms = 500 } },
]
