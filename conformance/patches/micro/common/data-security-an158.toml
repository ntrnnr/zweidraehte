# A local factory reset intentionally erases the application. Restore the
# operator-provisioned sample image only after each case has finished testing
# the erased state, so later cases do not inherit a missing application.
[[patch]]
after = "CAA05E4B-4C05-463D-9453-CE41FF781B3A"
why = "3.8.12.5 leaves the sample application erased; restore the EITT bench image for subsequent cases"
insert = [{ full_reset = 3000 }, { wait = 1500 }]

[[patch]]
after = "3992A704-746B-4FFD-AFDC-0DC5F53D5A03"
why = "3.8.13.6 leaves the sample application erased; restore the EITT bench image for subsequent cases"
insert = [{ full_reset = 3000 }, { wait = 1500 }]

[[patch]]
after = "7EE0E069-19D2-4126-9DC8-59B545B839DC"
why = "3.8.14.5 leaves the sample application erased; restore the EITT bench image for subsequent cases"
insert = [{ full_reset = 3000 }, { wait = 1500 }]

[[patch]]
after = "96F4E6E1-012C-4D05-881C-E893D1A8BDB3"
why = "3.8.15.7 leaves the sample application erased; restore the EITT bench image for subsequent cases"
