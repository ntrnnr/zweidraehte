# Cleanup assumes the last local reset left the DUT on FDSK. The boundary
# restore above has already returned the EITT image to TK1; keep the remaining
# TK1 sequence normalisation and omit only the now-redundant reprovisioning.
[[patch]]
skip = "192E766A-01AD-4BBF-BAD5-B18459ECCCDA"
why = "Cleanup's FDSK sync is redundant after the boundary full reset restored TK1"

[[patch]]
skip = "BCEB8A94-04C0-4445-9D85-3DDDFBE98C77"
