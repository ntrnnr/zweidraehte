# The Management association-table collection assumes that an operator
# reconfigures the application before each topology and stimulates its local
# inputs for the sending cases. The micro conformance image contains every
# topology at once. These patches select the matching input address and drive
# the application's own status objects; all expected telegrams still travel
# through the DUT's group-object server and configured association table.

template = "KnxConformanceTestTemplate-Management"

# ============================================================================
# 5.2.1 — Receiving telegrams
# ============================================================================

[[patch]]
replace = "B8B5E1C1-460E-4284-AD0B-7BBB0B7760AC"
why = "5.2.1 test 2: select the fixture's 1-to-n input address"
insert = [{ inject = { data = "BC #EDI 09 03 E1 00 81" } }]

