template = "KnxConformanceTestTemplate-Management"

# The template toggles programming mode through a custom PID 36 property that
# belongs to its sample application rather than to a mask-defined object.
# Micro DUT fixtures expose the same physical resource through harness control.

[[patch]]
replace = "19C60DB1-8BE6-447A-BADA-92EA606BB0F5"
why = "2.3.3 setup: set the micro DUT's programming-mode resource through fixture control"
insert = [{ set_programming_mode = true }]
[[patch]]
skip = "65BEE22C-C44F-410C-8F7C-D4B2C19C28BC"
why = "2.3.3 setup: DUT control has no KNX Property response"
[[patch]]
replace = "1C8BAB22-009A-4306-9A09-2EAFA74FB463"
why = "2.3.3 cleanup: clear the micro DUT's programming-mode resource through fixture control"
insert = [{ set_programming_mode = false }]
[[patch]]
skip = "8EEFC9C9-A826-43AC-B410-AC2C2DECCDE5"
why = "2.3.3 cleanup: DUT control has no KNX Property response"

[[patch]]
