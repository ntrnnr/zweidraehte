# The XML narrates silence in these four negative cases but contains no OUT
# step, so make the verdict executable.
[[patch]]
after = "4B86644C-01A8-46BD-9080-07473CD35916"
why = "2.3.1: programming-mode-off IA read must remain unanswered"
insert = [{ expect_none = 1000 }]
[[patch]]
after = "A55C75E9-3BF6-44FA-8172-2F58CBC71879"
why = "2.3.2: an incoming IA response must remain unanswered"
insert = [{ expect_none = 1000 }]
[[patch]]
after = "9597767F-F873-444C-B78A-AD20C054D0EC"
why = "2.3.4: an incoming IA response must remain unanswered even in programming mode"
insert = [{ expect_none = 1000 }]
[[patch]]
after = "3736D63C-C9C5-49CF-B0C8-CE0ADCF33A61"
why = "2.4.1: programming-mode-off IA write must remain unanswered and have no effect"
insert = [{ expect_none = 1000 }]

# The restart case assumes an application-specific Property for controlling
# and reading programming mode. Exercise the same observable resource through
# the fixture control before restart and the mandatory broadcast IA service
# after the DUT has rebooted.
[[patch]]
before = "7F505353-E5E2-4197-A332-15DA4F50389B"
why = "2.9.1 setup: make programming-mode reset observable without the template application's custom Property"
insert = [{ set_programming_mode = true }]
[[patch]]
replace = "3cfcfdf1-eb9d-497f-a502-f06189aa58b0"
why = "2.9.1 verification: probe programming mode with the standard broadcast IA service after restart"
insert = [{ inject = { data = "BC #EDI 00 00 E1 00 00" } }]
[[patch]]
replace = "2b5446b4-80cc-4487-8c17-163c8953046a"
why = "2.9.1 verification: a rebooted device with programming mode off must not answer the IA probe"
insert = [{ expect_none = 1000 }]
