# ============================================================================
# 3.8.15.6 offers two exhaustion points; ours is the other one
# ============================================================================
#
# The case's acceptance reads "The BDUT stops sending after
# PID_SEQUENCE_NUMBER_SENDING has reached its maximum value (optionally
# maximum value minus 1)", and its own prose carries the second variant's
# values: "Alternatively write value = FFFFFFFFFFFDh" before the write and
# "Alternatively response value = FFFFFFFFFFFEh" before the response. The
# XML encodes the first variant — write FFFFFFFFFFFEh, answer with
# FFFFFFFFFFFFh, then fall silent.
#
# `reserve_next_seq_nr` refuses at the maximum rather than one past it, so
# ours is the "minus 1" device: it answers with FFFFFFFFFFFEh and falls
# silent one frame earlier. Stopping earlier can only ever be safe — the
# frame it declines to send is the one that would leave the counter with
# nowhere to advance to — and the case explicitly admits it, so the two
# telegrams move to the alternative values the prose names rather than the
# device moving to the riskier boundary.
#
# The closing silence is unpatched: it is the same assertion either way.

[[patch]]
replace = "DBDC3898-6C08-43FD-B801-8B1DFBAECAB5"
why = """
3.8.15.6: ours is the "(optionally maximum value minus 1)" device its own \
acceptance admits, so the seed is the FFFFFFFFFFFDh its prose names as \
the alternative.\
"""
insert = [
  { inject_secure = { data = "3C 60 #EDI #BDUT_ADDR 0F 01 CE 00 11 00 10 3B 01 00 01 FF FF FF FF FF FD", key = "TK1" } },
]

