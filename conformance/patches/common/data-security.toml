# ============================================================================
# Cleanup re-provisions a device the boundary restores already restored
# ============================================================================
#
# The template's Cleanup assumes the bench state the preceding local
# resets left behind: a device on the FDSK, whose tool key it writes
# back to TK1 under FDSK before the final normalisation. Our local-reset
# patches end each of those cases with a `full_reset`, which returns the
# DUT to its boot image — already keyed TK1 — so the FDSK-keyed sync and
# tool-key write meet a device that cannot decrypt them. The remaining
# Cleanup steps (the sequence-number write and the closing sync, both
# under TK1) run unchanged and do the actual normalisation.

[[patch]]
skip = "192E766A-01AD-4BBF-BAD5-B18459ECCCDA"
why = "Cleanup: FDSK sync assumes the un-restored post-reset device; the boundary full_reset already put TK1 back"

[[patch]]
skip = "BCEB8A94-04C0-4445-9D85-3DDDFBE98C77"
why = "Cleanup: response half of the skipped FDSK sync"

[[patch]]
skip = "40E891FE-8EB9-465A-8A33-51603B6E82AD"
why = "Cleanup: the FDSK-authenticated tool-key write is the re-provision the boundary full_reset already performed"

[[patch]]
skip = "F8EF2B30-B630-48A6-8B8C-0C43CC61A172"
why = "Cleanup: response half of the skipped tool-key write"
