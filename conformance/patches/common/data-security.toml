# ============================================================================
# The local-reset cases wipe the application and never put it back
# ============================================================================
#
# Each case whose `@@` pause we answer with a real local master reset
# (erase 02h) leaves the device without its address / association /
# group-key tables — the reset is the point of the case, and the case's
# own tail restores only the DoA, the IA and the tool key. The bench
# operator would reload the sample application before the next case; the
# group exchanges of 3.8.17.x otherwise die in TSAP resolution against
# an empty address table. Same reasoning as the AN170 collection-boundary
# restore: `full_reset` returns the DUT to its boot image, and each patch
# names the case whose reset it cleans up after.

[[patch]]
after = "CAA05E4B-4C05-463D-9453-CE41FF781B3A"
why = "3.8.12.5's local factory reset wiped the application tables; restore the boot image for the cases that follow"
insert = [
  { full_reset = 3000 },
  { wait = 1500 },
]

