# Harness patches for the EITT TSSJ data-security template — the
# device-neutral majority.
#
# Anchors are the GUIDs the template gives every telegram. If one stops
# resolving the run fails rather than quietly dropping the patch — that
# is the signal the template has been revised and the compensation here
# needs re-checking.
#
# Every patch here compensates for something about the *template* or the
# harness rather than about a BCU family: a stray token, a countdown the
# run's timing cannot produce, an operator action the bench cannot
# perform, a device the template factory-resets and never restores. Both
# secure profiles list this file.
#
# What is NOT here: the patches that relocate the GO security flags onto
# our fixture's own communication objects. Those encode a property
# element index, and the two families number communication objects
# differently — see `systemb/data-security-go-flags.toml` and
# `system7/data-security-go-flags.toml`.
#
# See conformance/src/eitt/patch.rs.

template = "KnxConformanceTestTemplate-TSSJ DataSecurity"

# ============================================================================
# 6.2.8 has a stray token in its first telegram
# ============================================================================
#
# The telegram reads
#
#     BC #EDI #BDUT_ADDR 6C 01 D4 00 09 00 10 42 00 01 82 19 ??? 06 55
#
# and `???` is not a construct EITT has. Wildcards are for destination
# addresses in OUT telegrams and for RF serial numbers (manual §12.10,
# §12.19.2); this is a telegram EITT sends, and it is the only `???` in
# all 3435 telegrams of the template.
#
# It is a stray token splitting the group address, not a wildcard octet.
# Its six sibling telegrams in the same case all read
#
#     ... 42 00 01 <flags> #GO_2 55
#
# and `#GO_2` is 3/1/6, which is `19 06` — the two octets this line has
# `???` sitting between. The case's own prose says "group address 3/1/6
# and value 55h".
#
# The length octet settles it. `6C` gives an APDU length of Ch, so
# thirteen octets follow it; the siblings have exactly thirteen, and this
# telegram has thirteen only once the stray token is gone. Reading `???`
# as an octet — wildcard or otherwise — makes the frame disagree with its
# own length field.
#
# So this restores the group address rather than substituting anything.
# The rest of the telegram is reproduced unchanged, including the 82h
# flags byte that is what 6.2.8 is testing.

[[patch]]
replace = "FE4B9F1C-F08A-49A6-A085-C42125CED707"
why = """
6.2.8: `???` is a stray token splitting the `19 06` group address, not a \
wildcard — the frame's own length octet (6Ch ⇒ 13 octets) only adds up \
once it is removed, and the six sibling telegrams write the same address \
as `#GO_2`.\
"""
insert = [
  { inject = { data = "BC #EDI #BDUT_ADDR 6C 01 D4 00 09 00 10 42 00 01 82 19 06 55" } },
]

# ============================================================================
# Restore the device at the AN158 → AN170 collection boundary
# ============================================================================
#
# 3.8.13.1 sends `A_Restart` with erase code 02h — a factory reset:
#
#     BC #EDI #BDUT_ADDR 63 03 81 02 00
#
# which is the point of that case, since PID_TOOL_KEY is meant to revert
# to FDSK. It also wipes the application program and the Communication
# Object Table, and the template never downloads them again. On a bench
# the operator reconfigures the device between collections; a runner has
# to do it explicitly.
#
# Everything in AN170 needs a loaded application, so the whole collection
# ran against a blank device: `PID_OPERATION_MODE` writes were refused
# because the application is not running (state *reads* still answered,
# which is why the negative cases all passed and only the positive ones
# failed), and every `cot.object()` lookup missed, so GO Diagnostics
# answered A1h E_GD_GO_VOID throughout. Running 3.8.13 alone before 6.1
# reproduces 16 of the 17 failures; suite 6 on its own has 7.
#
# The reset goes here rather than after 3.8.13.1 for two reasons: the
# rest of 3.8.13 is *about* the post-factory-reset state and must keep
# seeing it, and AN163 (4.x) and AN177 (5.x) are demonstrably unaffected
# — 13 and 10 failures either way — so this is the first point where the
# device is next required to be loaded.
#
# `full_reset` restores the DUT's boot image, which is a loaded and
# running application with the tool and group keys installed, and resets
# the runner's own sequence bookkeeping with it. The `wait` afterwards
# clears the S-A_Sync_Req rate-limit window, whose timer is wall-clock
# and survives the respawn.

[[patch]]
before = "8D9803C9-54F4-4061-86E5-BE17C05014ED"
why = """
AN170 opens against a device that 3.8.13.1 factory-reset (A_Restart erase \
code 02h), so the application program and Communication Object Table are \
gone and the template never reloads them — the bench operator would have. \
Restores the boot image at the collection boundary.\
"""
insert = [
  { comment = "Collection boundary: restore the application 3.8.13.1's factory reset wiped" },
  { full_reset = 3000 },
  { wait = 1500 },
]

# ============================================================================
# 6.1.6 pins a mid-countdown time_left the run's timing cannot produce
# ============================================================================
#
# The case activates Diagnostic Mode, expects `#OPER_MODE_TIME_LEFT`
# (30 = 1Eh), and its second expectation pins `#OPER_MODE_TIME_LEFT-2`
# (28 = 1Ch) — a value that requires two seconds to have passed. But
# every telegram in the case says `Wait="no"` and the only 2 s in it is
# the first expectation's receive window, which closes the moment the
# response arrives. The countdown itself ticks correctly (it scales with
# `KNX_TIME_DIVISOR`, which is what lets 6.1.11's explicit waits read
# the ticking value) — there is simply no step in this case that lets
# two seconds elapse, at any speed. The 1Ch is authored for a bench
# where handling latency happened to approximate it.
#
# Only the time_left octet gives way, and only on the second
# expectation. The first stays pinned at 1Eh, which is what actually
# covers the 30 s timeout value; wildcarding both would stop testing it
# at all.

[[patch]]
replace = "25FD3493-8486-4E05-9F87-D939B7727234"
why = """
6.1.6: the second expectation pins time_left two seconds into the countdown, but every telegram in the case is Wait="no" and its only 2 s is a receive window that closes on match — no step lets the time pass, at any clock speed. Only the time_left octet is wildcarded; the first expectation keeps 1Eh pinned so the 30 s timeout stays covered."""
insert = [
  { expect = { data = "BC #BDUT_ADDR #EDI 6A 01 D6 00 03 00 10 34 20 00 01 ??", timeout_ms = 200 } },
]

# ============================================================================
# 5.2.5's third read is for devices with an APDU shorter than 254
# ============================================================================
#
# The case sends three MemoryExtended_Reads and its prose says what each
# is for:
#
#   MemExt_Read 0 bytes                     → FDh
#   MemExt_Read 250 bytes …                 → F4h (alternatively FFh)
#   "Only for devices supporting APDU length smaller than 254"
#   MemExt_Read 249 bytes, but response would exceed APDU length
#
# We are exactly 254 (`MAX_APDU_LENGTH_EXTENDED`), so the third read is
# the one the template scopes out itself. 249 octets is a request we can
# actually serve, and answering it with data is correct — there is no
# error to return.
#
# The first two run and pass: size 0 draws FDh, and 250 draws F4h now
# that `handle_memory_extended_read` refuses an over-budget read instead
# of quietly truncating it.
#
# Only the third exchange comes out, not the whole case, so the two
# sub-cases that do apply keep testing.

[[patch]]
skip = "0ACD029A-92B7-40A7-BE9C-A7C38294A602"
why = """
5.2.5: the 249-octet read is prefaced "Only for devices supporting APDU \
length smaller than 254" and ours is exactly 254, so the request fits \
and there is no error to return.\
"""

[[patch]]
skip = "BA6739AF-0E5F-4019-9E90-99AF8D033169"
why = "5.2.5: the expectation belonging to the 249-octet read above"

# ============================================================================
# The template's own preparation factory-resets the sample application away
# ============================================================================
#
# "Test Preparation - BDUT setup" sends `A_Restart` with erase code 02h
# ("FactoryReset with IA"):
#
#     BC #EDI #BDUT_ADDR 63 03 81 02 00
#
# and then re-establishes only the individual address, the tool key and
# the Security IO load state. On the certification bench that is enough,
# because the operator loads the AN158 sample application (the "2.3.1"
# object settings: GAs 1/1/1..6/6/6, keys GK1..GK5, per-GO security
# flags) into the BDUT before the run — every 3.2 case says so in its
# "Required BDUT setting" prose.
#
# Our DUT's factory reset wipes exactly those tables, and nothing in the
# template reloads them, so every group-addressed frame afterwards died
# in the transport layer with no TSAP: the four positive 3.2 cases and
# the group half of 3.8.17.1. `full_reset` restores the boot image —
# which *is* the loaded sample application with GK1..GK6 and TK1
# installed, the runner's stand-in for the operator's reload — and the
# wait clears the sync rate-limit window, whose timer is wall-clock.
#
# The anchor is the tool-key write response, not the end of the
# preparation: the boot image's Security IO load state is Unloaded, and
# the preparation's own closing steps are exactly the Unloaded → Loading
# → Loaded transitions — restoring *before* them lets the template put
# the restored device into the Loaded state it hands to 3.1.

[[patch]]
after = "4E927E12-B60B-4DF3-934B-4569D16CA709"
why = """
the preparation's erase-02 factory reset wipes the address/association \
tables, group keys and GO security flags of the sample application the \
bench operator would reload; every 3.2 case assumes the "2.3.1" object \
settings are present. The boot image is that application.\
"""
insert = [
  { comment = "Preparation reset the device: restore the sample application the bench would reload" },
  { full_reset = 3000 },
  { wait = 1500 },
]

