# Harness patches for the EITT group-object template.
#
# Anchors are the GUIDs the template gives every telegram. If one stops
# resolving the run fails rather than quietly dropping the patch — that
# is the signal the template has been revised and the compensation here
# needs re-checking.
#
# See conformance/src/eitt/patch.rs.

template = "KnxConformanceTestTemplate-GroupObjects"

# ============================================================================
# 1.4.1.1 — BDUT sends A_GroupValue_Read
# ============================================================================
#
# EITT drives a BCU whose Group Object Server polls the communication
# flags and transmits by itself when the application sets the read
# request (03/04/01 §3.3.2 fig. 3, "The Group Object Server polls the
# communication flag"). Our stack separates communication object state
# from bus operations, so writing the flag through GO1 sets the status
# and stops there; the request has to be kicked.
#
# ASAP 1 is GO0, the object under test.

[[patch]]
after = "02E382CC-9DE4-44C6-A2AD-B8FC381CC979"
why = "1.4.1.1 low priority: kick the read our GO server does not send by itself"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "24CA46DC-0E20-4F9F-A540-391795627AE4"
why = "1.4.1.1 normal priority: kick the read"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "94946A2D-3D59-4ACA-8A35-C4919920347A"
why = "1.4.1.1 urgent priority: kick the read"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "22AD4D2B-F937-4135-BA58-ED5B9C06938C"
why = "1.4.1.1 system priority: kick the read"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "4234193E-D374-42F2-B6EB-B7C992A4270F"
why = "1.4.1.1 communication disabled: kick the read so the error status is reached"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "D3FE9FA1-820E-44CE-93C6-9D341C3720CE"
why = "1.4.1.1 read disabled: kick the read"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "2608111F-70E4-4AFE-B40D-928C3A340978"
why = "1.4.1.1 write disabled: kick the read"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "46FE352C-B84B-43D2-822B-53F6E5AF91DA"
why = "1.4.1.1 transmission disabled: kick the read so the error status is reached"
insert = [{ trigger_read = 1 }]

[[patch]]
after = "F8F68985-6D41-4975-85B8-8FD703C805BD"
why = "1.4.1.1 read response update disabled: kick the read"
insert = [{ trigger_read = 1 }]

