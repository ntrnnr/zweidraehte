# 3.8.17.2/.3/.5 read the same relocated GO-flag fixture back
# ============================================================================
#
# The collection's later cases verify that the refused writes and the
# restarts left the reserved-bits values from 3.8.17.1 in place. Those
# values now live at elements 11-13 (our COs) in the reordered
# `FC FD FF`, so the verification reads move with them. The refused
# plain/A-only reads and writes are untouched: their responses echo the
# request with count 0, so the element index never reaches a table.

