# TSSJ data-security patches that relocate the GO security flags —
# System B.
#
# The template's reference application keeps its three secure group
# objects at GO numbers 0-2 and writes PID_GO_SECURITY_FLAGS (61) for
# them starting at property element 1. Our fixture's secure GOs are
# GO_SEC_2, GO_SEC_0 and GO_SEC_1 — communication objects 11, 12 and 13
# — so every one of these writes and reads is redirected to *our*
# elements, with the values reordered so each group address keeps the
# protection the case means it to have.
#
# The element index is where the two families part. The flags table is
# positional: slot = wire ASAP - `StackDefinition::FIRST_ASAP`, and
# PropertyExtValue numbers elements from 1, so
#
#     element = (ASAP - FIRST_ASAP) + 1
#
# System B has FIRST_ASAP = 1, so COs 11-13 occupy slots
# 10-12 and the writes start at element 11 (0Bh).
# That single octet is the whole difference between this file and its
# sibling; everything else — the anchors, the values, the reasoning —
# is identical.
#
# See conformance/src/eitt/patch.rs.

template = "KnxConformanceTestTemplate-TSSJ DataSecurity"

# ============================================================================
# 3.8.17.1 writes its GO security flags where the reference app keeps them
# ============================================================================
#
# The case writes PID_GO_SECURITY_FLAGS elements 1-3 because the
# reference application's three secure group objects are GOs 0-2. Ours
# are COs 11-13 (2D05h "5/5/5" on CO 11, 0901h "1/1/1" on CO 12, 1B03h
# "3/3/3" on CO 13 — see the TSAP map in conformance/src/harness/
# stack.rs), so the same writes land on elements 11-13 (property element
# N addresses CO N: the table entry is element-1, and the receive check
# reads entry asap-1) with the values reordered to follow: the
# template's `01 03 00` puts A-only on the 1/1/1 object, A+C on the
# 3/3/3 one and plain on 5/5/5, which for our numbering is `00 01 03`.
# The group exchanges that verify the flags are untouched — same
# fixture-relocation reasoning as 6.2.6/6.2.24.

[[patch]]
replace = "C6A18B55-54F5-48D5-886D-80C234D7CDF8"
why = "3.8.17.1: the reference app's secure GOs are 0-2, ours are COs 11-13 — same flags, elements 11-13, values reordered to keep each GA's protection"
insert = [
  { inject_secure = { data = "30 60 #EDI #BDUT_ADDR 0C 01 CE 00 11 00 10 3D 03 00 0B 00 00 00", key = "TK1" } },
]

[[patch]]
replace = "23CBA994-FB27-43A6-B52C-6AD62DDFFFDA"
why = "3.8.17.1: the reference app's secure GOs are 0-2, ours are COs 11-13 — same flags, elements 11-13, values reordered to keep each GA's protection"
insert = [
  { expect_secure = { data = "30 60 #BDUT_ADDR #EDI 0A 01 CF 00 11 00 10 3D 03 00 0B 00", key = "TK1", timeout_ms = 200 } },
]

[[patch]]
replace = "F118EB00-8624-48A8-9241-4F67B8EE8665"
why = "3.8.17.1: the reference app's secure GOs are 0-2, ours are COs 11-13 — same flags, elements 11-13, values reordered to keep each GA's protection"
insert = [
