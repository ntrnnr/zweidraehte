[[template.not_applicable]]
id = "8784BD49-3441-4287-9A65-0908E5E70C2D"
why = "2.7.17: \"CONDITIONAL and not applicable if the MAX_APDU_LENGTH is equal or greater than 66\"; ours is 254"

[[template.not_applicable]]
id = "47DF0849-EF46-4377-A68C-49B13304A00B"
