# Base-profile EITT coverage for the mask-0021h Data Secure composition.
#
# The System-2 requirements, TL Style 1 exceptions, memory fixture, and
# collection accounting are inherited from mask 0020h. This variant changes
# only capabilities added by the secure composition: connectionless DD0,
# extended frames with MAX_APDU_LENGTH 40, and the mask descriptor itself.
# The Data Secure supplement remains in tp1-bcu2-secure.toml because it boots
# the distinct AN158 sample application and provisioned security tables.

extends = "tp1-bcu2.toml"
dut = "bcu2-secure-base"

[[template]]
file = "KnxConformanceTestTemplate-TransportLayer.xml"
patches = ["conformance/patches/micro/bcu2/transport-layer.toml"]

[[template]]
file = "KnxConformanceTestTemplate-Management.xml"
patches = [
  "conformance/patches/micro/common/management-base.toml",
  "conformance/patches/micro/common/management-association-table.toml",
  "conformance/patches/micro/common/management-memory-bit.toml",
  "conformance/patches/micro/common/management-verify.toml",
  "conformance/patches/micro/common/management-serial.toml",
  "conformance/patches/micro/bcu2/management.toml",
  "conformance/patches/micro/bcu2/management-connectionless-dd.toml",
  "conformance/patches/micro/bcu2/management-secure-apdu40.toml",
]

[template.variables]
DD0_RESPONSE = "00 21"

# Connectionless Device Descriptor is needed by secure commissioning and is
# implemented by the composed profile even though it is optional on BCU2.
[[template.applicable]]
id = "9A53BCAD-72C5-4E66-BC0F-4B8179F0B2A1"
