# ============================================================================
# 8 TSS G — Load State Machines
# ============================================================================

[[template]]
file = "KnxConformanceTestTemplate-LoadStateMachines.xml"

[template.variables]
# Object 2 is the BCU2 Association Table object. Its RT2 storage starts at
# 0129h in this fixture and the template writes a seven-octet table image.
TEST_OBJ_INDEX = "02"
LOAD_EVENT_SEGMENT_TYPE = "00"
LOAD_EVENT_SEGMENT_CODING = "01 29 00 07 FF 03 80 00"
LOAD_EVENT_03_START_ADDR = "01 29"

[template.tl_sequence]
recompute = true
why = """
this template's own sequence numbers are stale. 2.2.2 and 2.3.2 open \
with the identical connect and request and then expect different \
acknowledgements from it. EITT recomputes management sequence numbers \
before a run (manual 12.2.3.14), unless TLSeqNum pins one.\
"""

[[template.not_applicable]]
id = "2F319664-DCA2-4B15-96A6-03C5ED531C33"
why = """
2.6 tries to install a key for level 3. On BCU2, four authorization levels \
mean levels 0-2 have keys and level 3 is the keyless free-access level; \
A_Key_Write for level 3 must answer FFh. The optional case assumes four \
writable keys and therefore cannot create the unauthorised state its later \
steps require on this profile.\
"""

# ============================================================================
# 8 TSS I — Run State Machines
# ============================================================================

[[template]]
file = "KnxConformanceTestTemplate-RunStateMachines.xml"
patches = ["conformance/patches/micro/bcu2/run-state-machines.toml"]

[template.variables]
# BCU2 has Device(0), Address Table(1), Association Table(2), and
# Application Program(3); there is no Group Object Table interface object.
TEST_OBJ_IDX = "03"

[[template.not_applicable]]
id = "97DB686D-39CF-4D28-B315-2E3851DD8AC3"
why = """
2.1 is an operator-adapted example rather than a portable conformance case. \
It factory-resets the DUT, writes an invented serial/address pair, and says \
to modify or deactivate the telegram for the actual BDUT. The fixture boots \
configured and has no operator step from which to supply that adaptation.\
"""

# ============================================================================
# 8/3/7 — AIL & Management (User Memory)
# ============================================================================

[[template]]
file = "KnxConformanceTestTemplate-Management.xml"
patches = [
  "conformance/patches/micro/common/management-base.toml",
  "conformance/patches/micro/common/management-no-connectionless-dd.toml",
  "conformance/patches/micro/common/management-memory-bit.toml",
  "conformance/patches/micro/common/management-verify.toml",
  "conformance/patches/micro/common/management-serial.toml",
  "conformance/patches/micro/bcu2/management.toml",
]
collections = [
  "2.3 - 2.4 Individual Address",
  "2.5 Device Descriptor",
  "2.6 - 2.7 Memory Access",
  "2.8 ADC",
  "2.9 Restart",
  "2.10 MemoryBit Access",
  "2.11 Authorization",
  "2.12 Key Access",
  "2.16 - 2.17 Individual Address Serial Number",
  "2.20 Illegal APCI",
  "2.31 - 2.33 User Memory Access",
]

[template.variables]
# Use the end of BCU2 RAM2. The 15-byte seed occupies 09B0h..09BEh;
# 09CFh is the last accessible byte, and a two-byte operation beginning
# there must fail atomically at the 0A00h void.
MEM_ACCESSIBLE_START = "09 B0"
MEM_ACCESSIBLE_END = "09 CF"
MEM_PROTECTED_START = "0A 00"
DD0_RESPONSE = "00 20"
BDUT_SERIAL_NUMBER = "FE ED BA BE CA FE"
MEM_START_BLOCK_LEVEL_1 = "04 00"
MEM_START_BLOCK_LEVEL_2 = "03 20"
# Keep the direct-memory fixture in the BCU2 RAM2 window. It is large enough
# for the 63-byte seed and has a real upper boundary at 09CFh.
MEMPOS = "09 70"
MEMPOS_LASTACCESS = "09 CF"
MEMPOS_PROTECTED = "0A 00"

