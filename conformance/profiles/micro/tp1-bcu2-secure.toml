# Data Secure supplement for the TP1 BCU2 conformance fixture.
#
# Data Secure is a composition choice, not a synonym for mask 0021h. This
# concrete fixture uses 0021h for its APDU-40 implementation, while
# `tp1-bcu2.toml` owns the ordinary System-2 Network/Transport/Load/Run profile.
# Keeping the supplement focused avoids duplicating that entire profile and
# mirrors the separate sample applications used by the EITT bench.

medium = "tp"
dut = "bcu2-secure"

[addresses]
EDI = "AF FE"
BDUT = "10 01"

[commands]
pause = "ignore"

# ============================================================================
# 8 TSS J — Data Security
# ============================================================================
#
# Data Secure is a profile module, so this is selected by the secure
# composition rather than by mask 0021h. AN158 covers the S-AL, access policy,
# and Security IO; AN177 covers the mandatory extended-memory services. The
# other two collections need application fixtures this deliberately small
# light switch does not provide.

[[template]]
file = "KnxConformanceTestTemplate-TSSJ DataSecurity.xml"
collections = [
  "AN158 KNX Data Security",
  "AN177 Extended Memory Services",
]
patches = [
  "conformance/patches/micro/common/data-security-an158.toml",
  "conformance/patches/micro/common/data-security-an177.toml",
  "conformance/patches/micro/bcu2/data-security-style1.toml",
]

[[template.skipped_collection]]
name = "AN163 Extended Interface Object Addressing"
why = """
AN163 requires a manufacturer-defined Interface Object of type C351h with \
writable scalar and array Properties chosen by its PIXIT fields. The BCU2 \
light-switch product has no such object. Its mandatory extended Property \
services are exercised against the Device and Security Interface Objects in \
AN158; manufacturing a certification-only object would test a different \
application fixture.\
"""

[[template.skipped_collection]]
name = "AN170 Group Object Diagnostics"
why = """
AN170 requires PID_OPERATION_MODE and PID_GO_DIAGNOSTICS on a Group Object \
Table Object plus a diagnostic sample application. The micro BCU2 fixture \
does not implement that object or service yet. This is a known missing \
mandatory feature for an S-mode secure device with Group Objects, not a claim \
that AN170 is inapplicable.\
"""

[template.variables]
BDUT_ADDR = "10 01"
DD0_RESPONSE = "00 21"
SER_NUM = "FE ED BA BE CA FE"
BDUT_SERIAL_NUMBER = "FE ED BA BE CA FE"

# The Security IO follows the four System-2 base objects in the composed
# compatibility scan. Extended services still address it as OT 17 instance 1.
SEC_INTF_OBJ_INDEX = "04"

# AN177's three adjacent regions and AN158's two access-policy probes live in
# the conformance-only BCU2 memory policy. Production keeps the real memory
# map; the policy type is zero-sized in both builds.
READWRITE_MEM_START = "00 02 00"
READWRITE_MEM_END = "00 02 FF"
READONLY_MEM_START = "00 03 00"
READONLY_MEM_END = "00 03 0F"
WRITEONLY_MEM_START = "00 03 10"
MEM_AP_000_000 = "00 03 D0"
MEM_AP_3FF_00C = "00 03 E0"

# Property-description indices are local to the BCU2 Device Object roster.
INDX_PID_SERIAL_NO = "04"
INDX_PID_DEVICE_CTRL = "01"

[template.tl_sequence]
recompute = true
why = """
the Data Security template contains stale connection-oriented sequence \
numbers in the same management exchanges as the System B and System 7 runs. \
EITT recomputes them before execution unless TLSeqNum explicitly pins a \
negative test; mirror that behaviour for the BCU2 transport.\
"""

