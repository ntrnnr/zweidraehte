# ============================================================================
# 8 TSS J — Data Security
# ============================================================================
#
# Data Secure is a profile module rather than a different mask. The ordinary
# templates above keep running against the plain 0705h process; this supplement
# selects the same family composed with the secure server and its AN158 sample
# application. AN177 runs because the secure alias raises the APDU ceiling to
# 40 while retaining the small polling implementation.

[[template]]
file = "KnxConformanceTestTemplate-TSSJ DataSecurity.xml"
dut = "micro-system7-secure"
collections = [
  "AN158 KNX Data Security",
  "AN177 Extended Memory Services",
]
patches = [
  "conformance/patches/micro/common/data-security-an158.toml",
  "conformance/patches/micro/common/data-security-an177.toml",
]

[[template.skipped_collection]]
name = "AN163 Extended Interface Object Addressing"
why = """
AN163 requires a manufacturer-defined Interface Object of type C351h with \
writable scalar and array Properties chosen by its PIXIT fields. The compact \
light-switch fixture has no certification-only object; its mandatory extended \
Property services run against the Device and Security Interface Objects in \
AN158.\
"""

[[template.skipped_collection]]
name = "AN170 Group Object Diagnostics"
why = """
AN170 requires PID_OPERATION_MODE and PID_GO_DIAGNOSTICS plus the diagnostic \
sample application. The secure micro System 7 composition exposes the required \
Group Object Table Object, but does not implement those services yet. This is \
a known missing mandatory feature, not a claim that AN170 is inapplicable.\
"""

[template.variables]
BDUT_ADDR = "10 01"
DD0_RESPONSE = "07 05"
SER_NUM = "FE ED 07 05 BE EF"
BDUT_SERIAL_NUMBER = "FE ED 07 05 BE EF"

# Five mask objects precede the two secure profile-module objects. Extended
# services address the Security IO as OT17/instance 1 at compatibility index 5.
SEC_INTF_OBJ_INDEX = "05"

READWRITE_MEM_START = "00 50 00"
READWRITE_MEM_END = "00 50 FF"
READONLY_MEM_START = "00 51 00"
READONLY_MEM_END = "00 51 0F"
WRITEONLY_MEM_START = "00 51 10"
MEM_AP_000_000 = "00 51 D0"
MEM_AP_3FF_00C = "00 51 E0"

# Property-description indices are local to the compact System 7 Device Object.
INDX_PID_SERIAL_NO = "05"
INDX_PID_DEVICE_CTRL = "01"

[template.tl_sequence]
recompute = true
why = """
the Data Security template contains stale connected-management sequence \
numbers. EITT recomputes them before execution unless TLSeqNum pins a negative \
test; mirror that behavior for the micro System 7 transport.\
"""

