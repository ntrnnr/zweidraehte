# Minimal TP1 BCU1/System-1 profile (mask 0012h) on the polling stack.
#
# BCU1 has no Interface Objects, Property services or load/run state
# machines. The profile therefore selects only collections that can describe
# the mask's actual service surface; every omitted Management collection is
# accounted for below rather than silently inheriting a newer-profile fixture.

medium = "tp"
dut = "bcu1"

[addresses]
EDI = "AF FE"
BDUT = "10 01"

[commands]
pause = "ignore"

# ============================================================================
# 8/3/7 §1.4.1 — Group Objects
# ============================================================================

[[template]]
file = "KnxConformanceTestTemplate-GroupObjects.xml"
collections = ["UINT1"]
patches = ["conformance/patches/micro/bcu1/group-objects.toml"]

[[template.skipped_collection]]
name = "UINT8"
why = "the UINT8 collection is an alternative sample application; this DUT loads the UINT1 application at the same group addresses"

[[template.not_applicable]]
id = "DC2C998A-3F98-44AB-A02A-A6014D7AF907"
why = "1.4.1.6 is conditional on read-on-init support; Resources §4.18.3 assigns RT1 bit 5 to the segment selector, while §4.18.6.2.4.1.3 introduces read-on-init with System B"

# ============================================================================
# 8/3/3 — Network Layer
# ============================================================================

[[template]]
file = "KnxConformanceTestTemplate-NetworkLayer.xml"
patches = ["conformance/patches/micro/bcu1/network-layer.toml"]

[template.variables]
# The independent network-layer object is an octet, so 3.1 produces the
# long-form response whose routing count the case examines.
GO_ADDR = "08 01"

[[template.not_applicable]]
id = "3EEC0158-0E26-4FBF-8C35-38DE5C24B674"
why = "3.3 uses Property Read or another point-to-point connectionless application service; BCU1 has no Properties and 06 Profiles §4.3 marks its connectionless Device Descriptor service not supported"

[[template]]
file = "KnxConformanceTestTemplate-TransportLayer.xml"
patches = ["conformance/patches/micro/bcu1/transport-layer.toml"]
collections = [
  "2 General Transport Layer Tests",
  "4 Testing of Timing Requirements",
  "6 Testing of Transport Layer State Machine",
]

[template.variables]
SER_NUM = "FE ED 00 12 BE EF"
GO_ADDR = "10 00"

[[template.command]]
category = "interface"
policy = "ignore"
why = "one mock bus carries both tool addresses, so @if+/@if- have nothing to switch"

[[template.not_applicable]]
id = "6E6FDBCA-0912-40BA-A10A-97955BD1CE61"
why = "4.1 has no telegrams — it is prose pointing at 6.2.5.1, which we do run"

# 8/3/7 — the BCU1-shaped AIL and Management service surface. Collections
# belonging only to newer profiles or optional features are accounted for
# explicitly below.
[[template]]
file = "KnxConformanceTestTemplate-Management.xml"
patches = [
  "conformance/patches/micro/common/management-base.toml",
  "conformance/patches/micro/common/management-no-connectionless-dd.toml",
  "conformance/patches/micro/common/management-memory-bit.toml",
  "conformance/patches/micro/bcu1/management.toml",
]
collections = [
  "2.3 - 2.4 Individual Address",
  "2.5 Device Descriptor",
  "2.6 - 2.7 Memory Access",
  "2.8 ADC",
  "2.9 Restart",
  "2.10 MemoryBit Access",
  "2.20 Illegal APCI",
  "2.31 - 2.33 User Memory Access",
]

[template.variables]
# Keep the 15-byte seed above the BCU1 object's RAM slots. The boundary at
# 00FFh is real even though EEPROM follows at 0100h: the service validates
# one declared memory region and must reject an operation spanning two.
MEM_ACCESSIBLE_START = "00 E0"
MEM_ACCESSIBLE_END = "00 FF"
MEM_PROTECTED_START = "02 00"
DD0_RESPONSE = "00 12"
# The 63-byte preparation block fits in otherwise unused page-0 RAM. The
# boundary case starts at 00FFh and must be rejected atomically because an
# operation may not span the RAM and EEPROM regions.
MEMPOS = "00 80"
MEMPOS_LASTACCESS = "00 FF"
MEMPOS_PROTECTED = "02 00"

