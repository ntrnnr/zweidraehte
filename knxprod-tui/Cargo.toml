[package]
name = "knxprod-tui"
version = "0.1.0"
edition = "2024"
authors = ["Andreas Galauner <andreas@galauner.de>"]
license = "Proprietary"
description = "TUI viewer for KNX ApplicationProgram MTXML files"

[features]
default = []
images = ["dep:ratatui-image", "dep:image"]

[dependencies]
knxprod = { path = "../knxprod" }

ratatui = "0.30"
crossterm = "0.28"
ratatui-image = { version = "10.0", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", optional = true }

clap = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }
simplelog = "0.12"
