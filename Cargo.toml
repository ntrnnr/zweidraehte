[workspace]
resolver = "2"
members = [
    "stack",
    "platform",
    "testutil",
    "conformance",
    "ets-macros",
    "knxprod",
    "knxprod-tui",
]

[workspace.package]
authors = ["Andreas Galauner <andreas@galauner.de>"]
keywords = ["knx"]
categories = ["knx"]
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
const-default = { version = "1.0", features = ["derive"] }
paste = "1.0"
static_cell = { version = "2.1", features = ["nightly"] }
defmt = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.12", features = ["macros"] }
serde_json = "1.0"
heapless = "0.9"
replace_with = { version = "0.1", default-features = false }

embassy-executor = { version = "0.9", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-sync = { version = "0.7", default-features = false }
embassy-futures = { version = "0.1", default-features = false }

embedded-io-async = { version = "0.6" }

async-hid = "0.4"
futures-lite = "2.5"

# Shared across multiple crates
chrono = "0.4"
quick-xml = { version = "0.37", features = ["serialize"] }
base64 = "0.22"
regex = "1"

# Common ecosystem crates
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
