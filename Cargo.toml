[workspace]
resolver = "2"
members = [
    "crates/zweidraehte-proto",
    "crates/zweidraehte-device",
    "crates/zweidraehte-microdevice",
    "crates/zweidraehte-platform",
    "crates/zweidraehte-client",
    "crates/zweidraehte-ets",
    "crates/zweidraehte-device-macros",
    "crates/zweidraehte-knxprod",
    "crates/zweidraehte-util",
    "crates/zweidraehte-fdsk-label",
    "examples/devices",
    "examples/support",
    "examples/generators",
    "conformance",
    "tools/knxprod-tui",
    "tools/compare-programs",
    "tools/bus-tools",
    "tools/knx-provision",
    "tools/knx-config",
]

[workspace.package]
authors = ["Andreas Galauner <andreas@galauner.de>"]
keywords = ["knx"]
categories = ["knx"]
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
const-default = { version = "1.0", default-features = false, features = ["derive"] }
paste = "1.0"
static_cell = { version = "2.1", features = ["nightly"] }
defmt = "1.0"
log = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_with = { version = "3.12", default-features = false, features = ["macros"] }
# no_std postcard codec for the ConfigStore device-config blob. Matches the
# `firmware/` workspace's `default-features = false` (no `use-std`) so the core
# crate stays no_std.
postcard = { version = "1.1", default-features = false }
serde_json = "1.0"
heapless = "0.9"
replace_with = { version = "0.1", default-features = false }
bitfield = "0.19"

# KNX IP Secure session crypto (X25519 ECDH + SHA-256 session-key
# derivation). Optional behind zweidraehte-proto's `ip-secure` feature so
# non-secure microcontroller builds never compile curve25519.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha2 = { version = "0.10", default-features = false }

embassy-executor = { version = "0.9", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-sync = { version = "0.7", default-features = false }
embassy-futures = { version = "0.1", default-features = false }

# Pinned to 0.6 to match embassy-rp 0.9 — the firmware/rp2040/tp1_light_switch target passes
# BufferedUart directly to TpUartLinkLayerBuilder, so the trait version must
# be consistent across both workspaces.
embedded-io-async = { version = "0.6" }

async-hid = "0.4"
futures-lite = "2.5"

# Shared across multiple crates
chrono = "0.4"
quick-xml = { version = "0.37", features = ["serialize"] }
base64 = "0.22"
regex = "1"

# Common ecosystem crates
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
